<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d5f5b">
<title>App 下载中心</title>
<style>
  :root {
    --bg: #f1f6f5;
    --panel: #ffffff;
    --ink: #142f31;
    --muted: #637779;
    --line: #dbe7e5;
    --teal: #0b7a72;
    --teal-dark: #0d5f5b;
    --teal-soft: #e4f3f0;
    --amber: #b7791f;
    --shadow: 0 16px 40px rgba(13, 47, 49, .10);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  .shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .masthead {
    position: relative;
    background:
      linear-gradient(115deg, rgba(12, 88, 84, .96), rgba(11, 122, 114, .94)),
      repeating-linear-gradient(135deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 13px);
    color: #fff;
    overflow: hidden;
  }

  .masthead::after {
    content: "";
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: -34px;
    height: 74px;
    background: var(--bg);
    border-radius: 50% 50% 0 0;
    transform: rotate(-1deg);
  }

  .masthead-inner,
  .main,
  .footer-inner {
    width: min(980px, 100%);
    margin: 0 auto;
  }

  .masthead-inner {
    padding: 34px 22px 64px;
  }

  .brandline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 800;
  }

  .brand-dot {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: rgba(255, 255, 255, .18);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .domain {
    font-size: 12px;
    color: rgba(255, 255, 255, .72);
    font-weight: 600;
  }

  .intro {
    margin-top: 42px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  .kicker {
    font-size: 12px;
    font-weight: 800;
    color: #9de0d5;
    letter-spacing: 0;
  }

  h1 {
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.12;
    letter-spacing: 0;
    margin-top: 10px;
  }

  .intro p {
    color: rgba(255, 255, 255, .82);
    font-size: 15px;
    line-height: 1.7;
    margin-top: 14px;
  }

  .count-pill {
    flex-shrink: 0;
    background: rgba(255, 255, 255, .13);
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
  }

  .count-pill strong {
    display: block;
    font-size: 22px;
    line-height: 1;
  }

  .count-pill span {
    font-size: 11px;
    color: rgba(255, 255, 255, .75);
    margin-top: 5px;
  }

  .main {
    flex: 1;
    padding: 0 22px 60px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 8px 2px 16px;
  }

  .section-head h2 {
    font-size: 20px;
  }

  .update-label {
    color: var(--muted);
    font-size: 12px;
    text-align: right;
  }

  .app-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .app-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 18px;
    color: inherit;
    text-decoration: none;
    display: grid;
    grid-template-columns: 64px 1fr auto;
    align-items: center;
    gap: 16px;
    transition: transform .16s, border-color .16s, box-shadow .16s;
  }

  .app-card:hover {
    transform: translateY(-2px);
    border-color: #75c6ba;
    box-shadow: 0 22px 46px rgba(13, 47, 49, .15);
  }

  .app-mark {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    color: #fff;
    font-size: 28px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 -8px 18px rgba(0, 0, 0, .10);
  }

  .app-copy {
    min-width: 0;
  }

  .app-copy h3 {
    font-size: 18px;
    overflow-wrap: anywhere;
  }

  .app-copy .desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin-top: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .meta-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .meta-chip {
    color: #426061;
    background: #f3f8f7;
    border: 1px solid #e5eeec;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
  }

  .meta-chip.live {
    color: var(--teal);
    background: var(--teal-soft);
    border-color: #cde9e2;
  }

  .open {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--teal);
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
  }

  .open .arrow-circle {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--teal-soft);
    color: var(--teal);
  }

  .footer {
    border-top: 1px solid var(--line);
    background: #fbfdfd;
    padding: 18px;
  }

  .footer-inner {
    color: var(--muted);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  @media (max-width: 680px) {
    .masthead-inner {
      padding: 22px 16px 54px;
    }

    .intro {
      display: block;
      margin-top: 30px;
    }

    .count-pill {
      display: none;
    }

    h1 {
      font-size: 32px;
    }

    .main {
      padding: 0 14px 40px;
    }

    .app-card {
      grid-template-columns: 54px 1fr;
      gap: 13px;
      padding: 15px;
    }

    .app-mark {
      width: 54px;
      height: 54px;
      font-size: 24px;
    }

    .app-copy .desc {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .open {
      grid-column: 1 / -1;
      justify-content: flex-end;
      border-top: 1px dashed var(--line);
      padding-top: 11px;
    }

    .open .text {
      font-size: 12px;
    }

    .arrow-circle {
      width: 32px;
      height: 32px;
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="masthead-inner">
        <div class="brandline">
          <div class="brand">
            <span class="brand-dot">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
                <path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </span>
            <span>App 下载中心</span>
          </div>
          <div class="domain" id="siteDomain"></div>
        </div>

        <div class="intro">
          <div>
            <div class="kicker">ANDROID APPLICATION</div>
            <h1>选择一个 App</h1>
            <p>进入对应的安卓下载页面，扫码或点击下载最新版。</p>
          </div>
          <div class="count-pill" id="countPill">
            <strong id="appCount">0</strong>
            <span>个可用应用</span>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="section-head">
        <h2>全部应用</h2>
        <div class="update-label" id="updateLabel"></div>
      </div>
      <div class="app-list" id="appList"></div>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span>© 2026 App 下载中心</span>
        <span id="footerDate"></span>
      </div>
    </footer>
  </div>

  <script src="apps.js"></script>
  <script>
    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    function cardIconSvg() {
      return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>';
    }

    function renderApps() {
      var list = document.getElementById("appList");
      if (!APPS || !APPS.length) {
        list.innerHTML = '<p class="empty">暂无可下载应用</p>';
        return;
      }

      APPS.forEach(function (app) {
        var card = document.createElement("a");
        card.className = "app-card";
        card.href = "download.html?id=" + encodeURIComponent(app.id);
        card.setAttribute("aria-label", "打开 " + app.name + " 下载页");

        var mark = document.createElement("div");
        mark.className = "app-mark";
        mark.style.background = app.icon || "#0b7a72";
        mark.textContent = app.name.charAt(0);

        var copy = document.createElement("div");
        copy.className = "app-copy";
        copy.innerHTML =
          "<h3>" + esc(app.name) + "</h3>" +
          '<div class="desc">' + esc(app.desc || "Android APK") + "</div>" +
          '<div class="meta-row">' +
            '<span class="meta-chip live">v' + esc(app.version) + "</span>" +
            '<span class="meta-chip">' + esc(app.size) + "</span>" +
            '<span class="meta-chip">更新 ' + esc(app.date) + "</span>" +
          "</div>";

        var open = document.createElement("div");
        open.className = "open";
        open.innerHTML = '<span class="text">查看下载页</span><span class="arrow-circle">' + cardIconSvg() + "</span>";

        card.appendChild(mark);
        card.appendChild(copy);
        card.appendChild(open);
        list.appendChild(card);
      });
    }

    function latestDate() {
      if (!APPS || !APPS.length) return "";
      return APPS.reduce(function (prev, app) {
        return app.date > prev.date ? app : prev;
      }, APPS[0]).date;
    }

    window.addEventListener("load", function () {
      renderApps();
      document.getElementById("appCount").textContent = APPS ? APPS.length : 0;
      document.getElementById("updateLabel").textContent = "最近更新 " + latestDate();
      document.getElementById("footerDate").textContent = "最近更新 " + latestDate();

      var domain = document.getElementById("siteDomain");
      try {
        domain.textContent = window.location.hostname || "ssyzi.site";
      } catch (err) {
        domain.textContent = "ssyzi.site";
      }
    });
  </script>
</body>
</html>
