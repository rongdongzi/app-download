<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f8f8">
<title>App 下载中心</title>
<style>
  :root {
    --bg: #f2f6f6;
    --panel: #ffffff;
    --ink: #1b3133;
    --muted: #718183;
    --line: #e3ecea;
    --brand: #0c7d74;
    --brand-dark: #0b5f5a;
    --brand-soft: #e6f4f1;
    --shadow: 0 10px 30px rgba(26, 66, 67, .08);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }

  .page {
    width: min(680px, 100%);
    margin: 0 auto;
    padding: 18px 16px calc(30px + env(safe-area-inset-bottom));
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 8px 0 26px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    color: var(--ink);
    font-size: 15px;
    font-weight: 800;
  }

  .brand svg {
    width: 30px;
    height: 30px;
    padding: 7px;
    background: linear-gradient(135deg, var(--brand), #38b2a4);
    border-radius: 8px;
    color: #fff;
  }

  .domain {
    color: var(--muted);
    font-size: 12px;
  }

  .headline h1 {
    font-size: 25px;
    line-height: 1.25;
    letter-spacing: 0;
  }

  .headline p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
    margin-top: 8px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 28px 0 12px;
  }

  .section-head h2 {
    font-size: 17px;
  }

  .section-head span {
    color: var(--muted);
    font-size: 12px;
  }

  .app-list {
    display: grid;
    gap: 10px;
  }

  .app-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 15px;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }

  .app-item::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--brand);
    opacity: 0;
    transition: opacity .15s;
  }

  .app-item:hover {
    transform: translateY(-2px);
    border-color: #b6dcd5;
    box-shadow: 0 14px 34px rgba(26, 66, 67, .12);
  }

  .app-item:hover::before {
    opacity: 1;
  }

  .app-icon {
    width: 62px;
    height: 62px;
    border-radius: 10px;
    color: #fff;
    font-size: 27px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: inset 0 -9px 16px rgba(0, 0, 0, .09), 0 8px 16px rgba(30, 70, 70, .14);
  }

  .app-info {
    flex: 1;
    min-width: 0;
  }

  .app-info h3 {
    font-size: 17px;
    overflow-wrap: anywhere;
  }

  .app-info p {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
    margin-top: 4px;
  }

  .app-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 9px;
  }

  .chip {
    color: #496466;
    background: #f3f8f7;
    border: 1px solid #e6eeec;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 7px;
  }

  .chip.teal {
    color: var(--brand);
    background: var(--brand-soft);
    border-color: #cde9e2;
  }

  .chevron {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--brand-soft);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .empty {
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted);
    padding: 40px 18px;
    text-align: center;
    font-size: 14px;
  }

  .footer {
    color: #94a5a5;
    font-size: 11px;
    text-align: center;
    padding-top: 26px;
  }

  @media (max-width: 480px) {
    .page {
      padding: 14px 12px calc(24px + env(safe-area-inset-bottom));
    }

    .headline h1 {
      font-size: 23px;
    }

    .app-item {
      padding: 13px;
      gap: 12px;
    }

    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      font-size: 24px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
          <path d="M2 12h20"></path>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>App 下载中心</span>
      </div>
      <div class="domain" id="siteDomain"></div>
    </header>

    <section class="headline">
      <h1>选择要安装的 App</h1>
      <p>进入应用专属下载页，扫码即可安装最新版。</p>
    </section>

    <div class="section-head">
      <h2>全部应用</h2>
      <span id="updateLabel"></span>
    </div>

    <main class="app-list" id="appList"></main>

    <footer class="footer" id="footerDate"></footer>
  </div>

  <script src="apps.js"></script>
  <script>
    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    function chevronSvg() {
      return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>';
    }

    function renderApps() {
      var list = document.getElementById("appList");
      if (!APPS || !APPS.length) {
        list.innerHTML = '<div class="empty">暂无可下载应用</div>';
        return;
      }

      APPS.forEach(function (app) {
        var item = document.createElement("a");
        item.className = "app-item";
        item.href = "download.html?id=" + encodeURIComponent(app.id);
        item.setAttribute("aria-label", "打开 " + app.name + " 下载页");

        var icon = document.createElement("div");
        icon.className = "app-icon";
        icon.style.background = app.icon || "linear-gradient(135deg, #0c7d74, #38b2a4)";
        icon.textContent = app.name.charAt(0);

        var info = document.createElement("div");
        info.className = "app-info";
        info.innerHTML =
          "<h3>" + esc(app.name) + "</h3>" +
          "<p>" + esc(app.desc || "Android APK") + "</p>" +
          '<div class="app-meta">' +
            '<span class="chip teal">v' + esc(app.version) + "</span>" +
            '<span class="chip">' + esc(app.size) + "</span>" +
            '<span class="chip">' + esc(app.date) + "</span>" +
          "</div>";

        var chevron = document.createElement("div");
        chevron.className = "chevron";
        chevron.innerHTML = chevronSvg();

        item.appendChild(icon);
        item.appendChild(info);
        item.appendChild(chevron);
        list.appendChild(item);
      });
    }

    function latestDate() {
      if (!APPS || !APPS.length) return "";
      return APPS.reduce(function (prev, app) {
        return app.date > prev.date ? app : prev;
      }, APPS[0]).date;
    }

    window.addEventListener("load", function () {
      renderApps();
      var date = latestDate();
      document.getElementById("updateLabel").textContent = "最近更新 " + date;
      document.getElementById("footerDate").textContent = "© 2026 App 下载中心 · 最近更新 " + date;
      document.getElementById("siteDomain").textContent = window.location.hostname || "ssyzi.site";
    });
  </script>
</body>
</html>
