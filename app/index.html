<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fb">
<title>App 下载中心</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --ink: #17212b;
    --muted: #66717f;
    --line: #e7eaf1;
    --brand: #2563eb;
    --brand-soft: #eef4ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: min(760px, 100%);
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom));
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 4px 2px 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 17px;
  }

  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    color: #fff;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    box-shadow: 0 4px 14px rgba(37, 99, 235, .20);
  }

  .brand small {
    display: block;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    margin-top: 3px;
  }

  .hero {
    background: linear-gradient(180deg, #ffffff, #f9fbff);
    border: 1px solid #e6eaf3;
    border-radius: 20px;
    padding: 24px 22px 22px;
  }

  .hero-content {
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--brand);
    background: var(--brand-soft);
    border: 1px solid #d7e5ff;
    font-size: 12px;
    font-weight: 600;
    border-radius: 999px;
    padding: 5px 10px;
  }

  .hero h1 {
    font-size: 26px;
    line-height: 1.32;
    margin-top: 13px;
  }

  .hero p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.75;
    margin-top: 8px;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #dfe4ee;
    border-radius: 12px;
    height: 48px;
    padding: 0 14px;
    margin-top: 20px;
    transition: border-color .15s, box-shadow .15s;
  }

  .search:focus-within {
    border-color: #a9c4ff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .06);
  }

  .search svg {
    color: #8a95a5;
    flex: none;
  }

  .search input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 26px 2px 12px;
  }

  .section-head h2 {
    font-size: 18px;
  }

  .section-head span {
    color: var(--muted);
    font-size: 12px;
  }

  .app-list {
    display: grid;
    gap: 10px;
  }

  .app-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    text-decoration: none;
    color: inherit;
    transition: transform .16s, border-color .16s, box-shadow .16s;
  }

  .app-item:hover {
    transform: translateY(-1px);
    border-color: #cbd7ea;
    box-shadow: 0 4px 16px rgba(25, 46, 86, .06);
  }

  .app-icon {
    width: 56px;
    height: 56px;
    border-radius: 15px;
    flex: none;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 12px rgba(30, 45, 75, .10);
  }

  .app-main {
    min-width: 0;
    flex: 1;
  }

  .app-main h3 {
    font-size: 16px;
  }

  .app-main p {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .app-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .chip {
    font-size: 11px;
    font-weight: 600;
    color: #556276;
    background: #f3f5f9;
    border-radius: 7px;
    padding: 3px 7px;
    white-space: nowrap;
  }

  .chip.update {
    color: var(--brand);
    background: var(--brand-soft);
  }

  .chip.soon {
    color: #b45309;
    background: #fff7ed;
  }

  .arrow {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #f4f6fa;
    color: #556276;
    display: grid;
    place-items: center;
    flex: none;
  }

  .empty {
    background: #fff;
    border: 1px dashed #d7dde9;
    border-radius: 16px;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    padding: 36px 16px;
    display: none;
  }

  .empty.show { display: block; }

  .footer {
    color: #98a1af;
    font-size: 11px;
    text-align: center;
    margin-top: 30px;
  }

  @media (min-width: 620px) {
    .page { padding-top: 34px; }
    .hero { padding: 30px 28px; }
    .hero h1 { font-size: 31px; }
    .app-item { padding: 16px; }
    .app-icon { width: 62px; height: 62px; font-size: 26px; }
    .app-main h3 { font-size: 17px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">
        <span class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect>
            <path d="M11 18.5h2"></path>
          </svg>
        </span>
        <span>App 下载中心<small id="siteDomain">ssyzi.site</small></span>
      </div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <span class="eyebrow">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 7.2H22l-6 4.5 2.3 7.3-6.3-4.7-6.3 4.7L8 13.7 2 9.2h7.6z"></path></svg>
          Android 安装包
        </span>
        <h1>选择一个应用，扫码或点击直接安装</h1>
        <p>进入应用专属页面后，手机扫码即可下载最新版安装包。</p>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
          <input id="searchInput" type="search" placeholder="搜索应用" autocomplete="off">
        </label>
      </div>
    </section>

    <div class="section-head">
      <h2>全部应用</h2>
      <span id="updateLabel"></span>
    </div>

    <main class="app-list" id="appList"></main>
    <div class="empty" id="emptyBox">没有找到匹配的应用</div>

    <footer class="footer">© 2026 App 下载中心</footer>
  </div>

  <script src="apps.js"></script>
  <script>
    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    function gradient(accent) {
      var a = accent && accent[0] ? accent[0] : "#2563eb";
      var b = accent && accent[1] ? accent[1] : "#38bdf8";
      return "linear-gradient(135deg," + a + "," + b + ")";
    }

    function renderApps(keyword) {
      var list = document.getElementById("appList");
      var empty = document.getElementById("emptyBox");
      var kw = (keyword || "").trim().toLowerCase();
      var filtered = (APPS || []).filter(function (app) {
        return !kw || (app.name + " " + (app.desc || "") + " " + app.id).toLowerCase().indexOf(kw) !== -1;
      });

      list.innerHTML = "";
      filtered.forEach(function (app) {
        var a = document.createElement("a");
        a.className = "app-item";
        a.href = "download.html?id=" + encodeURIComponent(app.id);
        a.setAttribute("aria-label", "打开 " + app.name + " 下载页");

        var icon = document.createElement("span");
        icon.className = "app-icon";
        icon.style.background = gradient(app.accent);
        icon.textContent = app.name.charAt(0);

        var main = document.createElement("span");
        main.className = "app-main";
        var chips = '<span class="chip update">v' + esc(app.version) + "</span>" +
          '<span class="chip">' + esc(app.size) + "</span>" +
          '<span class="chip">' + esc(app.date) + "</span>";
        if (app.note) chips += '<span class="chip soon">' + esc(app.note) + "</span>";
        main.innerHTML =
          "<h3>" + esc(app.name) + "</h3>" +
          "<p>" + esc(app.desc || "Android 应用") + "</p>" +
          '<div class="app-meta">' + chips + "</div>";

        var arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>';

        a.appendChild(icon);
        a.appendChild(main);
        a.appendChild(arrow);
        list.appendChild(a);
      });
      empty.classList.toggle("show", filtered.length === 0);
    }

    function latestDate() {
      if (!APPS || !APPS.length) return "";
      return APPS.reduce(function (prev, app) { return app.date > prev.date ? app : prev; }, APPS[0]).date;
    }

    var searchTimer = null;
    window.addEventListener("DOMContentLoaded", function () {
      renderApps("");
      document.getElementById("updateLabel").textContent = "共 " + APPS.length + " 个应用 · 最近更新 " + latestDate();
      var host = window.location.hostname;
      if (host && host !== "localhost" && host !== "127.0.0.1") {
        document.getElementById("siteDomain").textContent = host;
      }
      document.getElementById("searchInput").addEventListener("input", function () {
        clearTimeout(searchTimer);
        var me = this;
        searchTimer = setTimeout(function () { renderApps(me.value); }, 120);
      });
    });
  </script>
</body>
</html>
