<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b5f5a">
<title>App 下载</title>
<style>
  :root {
    --ink: #193234;
    --muted: #6d8081;
    --line: #e3ecea;
    --brand: #0b7d74;
    --brand-deep: #0a5d59;
    --brand-soft: #e6f4f1;
    --panel: #ffffff;
    --bg: #eaf3f2;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
  }

  .page {
    width: min(520px, 100%);
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--bg);
  }

  .hero {
    background:
      radial-gradient(120% 90% at 50% 0%, #0c8f83 0%, #0a6b65 48%, #095550 100%);
    color: #fff;
    text-align: center;
    padding: 44px 22px 86px;
    position: relative;
    overflow: hidden;
  }

  .hero::before,
  .hero::after {
    content: "";
    position: absolute;
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero::before {
    width: 220px;
    height: 220px;
    right: -80px;
    top: -80px;
  }

  .hero::after {
    width: 150px;
    height: 150px;
    left: -60px;
    bottom: -40px;
  }

  .hero-inner {
    position: relative;
    z-index: 1;
  }

  .app-icon {
    width: 88px;
    height: 88px;
    margin: 0 auto;
    border-radius: 12px;
    color: #fff;
    font-size: 40px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 18px 34px rgba(0, 0, 0, .22),
      inset 0 -10px 22px rgba(0, 0, 0, .12);
  }

  .hero h1 {
    font-size: 27px;
    line-height: 1.3;
    letter-spacing: 0;
    overflow-wrap: anywhere;
    margin-top: 18px;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .18);
  }

  .hero p {
    color: rgba(255, 255, 255, .88);
    font-size: 14px;
    margin-top: 9px;
  }

  .chips {
    display: flex;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .chip {
    background: rgba(255, 255, 255, .16);
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 999px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 11px;
  }

  .content {
    position: relative;
    z-index: 2;
    margin: -52px 14px 0;
    background: var(--panel);
    border: 1px solid rgba(221, 235, 232, .9);
    border-radius: 8px;
    box-shadow: 0 22px 50px rgba(18, 67, 66, .16);
    padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
  }

  .scan-block {
    text-align: center;
  }

  .scan-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .scan-label svg {
    color: var(--brand);
  }

  .qr-frame {
    width: 236px;
    height: 236px;
    margin: 17px auto 10px;
    border-radius: 8px;
    background: #fff;
    border: 1px solid #dcebe8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    box-shadow: 0 8px 20px rgba(16, 67, 66, .06);
  }

  .qr-frame canvas {
    width: 212px;
    height: 212px;
    border-radius: 6px;
  }

  .tip {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
  }

  .wechat-hint {
    display: none;
    margin-top: 12px;
    background: #fff7df;
    border: 1px solid #efd68a;
    border-radius: 8px;
    color: #7a5410;
    font-size: 12px;
    line-height: 1.7;
    padding: 10px 12px;
    text-align: left;
  }

  .wechat-hint.show {
    display: block;
  }

  .download-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    min-height: 54px;
    margin-top: 20px;
    border-radius: 8px;
    background: linear-gradient(120deg, var(--brand-deep), var(--brand));
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 14px 28px rgba(11, 125, 116, .26);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }

  .download-btn:hover {
    transform: translateY(-1px);
    filter: saturate(1.08);
    box-shadow: 0 18px 34px rgba(11, 125, 116, .32);
  }

  .download-btn:active {
    transform: scale(.99);
  }

  .download-btn svg {
    width: 20px;
    height: 20px;
  }

  .missing {
    background: var(--panel);
    border-radius: 8px;
    box-shadow: 0 18px 40px rgba(18, 67, 66, .14);
    margin: 40px 16px;
    padding: 44px 20px;
    text-align: center;
  }

  .missing h1 {
    font-size: 21px;
  }

  .missing p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 9px;
  }

  .missing a {
    display: inline-block;
    margin-top: 18px;
    background: var(--brand);
    color: #fff;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: 800;
  }

  @media (min-width: 560px) {
    body {
      background: linear-gradient(180deg, #dbeae8, #eef5f4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .page {
      min-height: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(18, 67, 66, .18);
    }

    .content {
      border-radius: 8px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div id="content"></div>
  </div>

  <script src="apps.js"></script>
  <script src="qrcode.min.js"></script>
  <script>
    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    function getAppId() {
      var match = window.location.search.match(/[?&]id=([^&]+)/);
      if (!match) return "";
      try {
        return decodeURIComponent(match[1]);
      } catch (err) {
        return match[1];
      }
    }

    function isWeChat() {
      return /MicroMessenger/i.test(navigator.userAgent);
    }

    function renderApp(app) {
      var content = document.getElementById("content");
      content.innerHTML =
        '<section class="hero">' +
          '<div class="hero-inner">' +
            '<div class="app-icon" style="background:' + esc(app.icon || "linear-gradient(135deg, #0b7d74, #38b2a4)") + '">' + esc(app.name.charAt(0)) + "</div>" +
            "<h1>" + esc(app.name) + "</h1>" +
            "<p>Android 安卓版本</p>" +
            '<div class="chips">' +
              '<span class="chip">v' + esc(app.version) + "</span>" +
              '<span class="chip">' + esc(app.size) + "</span>" +
              '<span class="chip">' + esc(app.date) + "</span>" +
            "</div>" +
          "</div>" +
        "</section>" +
        '<section class="content">' +
          '<div class="scan-block">' +
            '<div class="scan-label">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>' +
              "<span>扫码下载</span>" +
            "</div>" +
            '<div class="qr-frame"><div id="qrBox"></div></div>' +
            '<p class="tip">使用手机扫码后可直接下载 APK 文件</p>' +
            '<div class="wechat-hint" id="wechatHint">当前在微信内下载可能受限，请点右上角选择“在浏览器打开”后再下载。</div>' +
            '<a class="download-btn" id="downloadBtn" href="' + esc(app.apkUrl) + '" download>' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>' +
              '<span>下载 v' + esc(app.version) + "</span>" +
            "</a>" +
          "</div>" +
        "</section>";

      document.title = app.name + " 下载";
      document.getElementById("downloadBtn").setAttribute("download", app.name + ".apk");
      if (isWeChat()) {
        document.getElementById("wechatHint").classList.add("show");
      }
      renderQR(app);
    }

    function renderQR(app) {
      var box = document.getElementById("qrBox");
      if (typeof QRCode === "undefined") {
        box.innerHTML = '<p style="color:#b42318;font-size:13px;">二维码组件加载失败</p>';
        return;
      }
      new QRCode(box, {
        text: app.apkUrl,
        width: 212,
        height: 212,
        colorDark: "#193234",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function renderMissing() {
      document.getElementById("content").innerHTML =
        '<div class="missing">' +
          "<h1>未找到该应用</h1>" +
          "<p>请返回首页选择要下载的 App。</p>" +
          '<a href="index.html">返回全部 App</a>' +
        "</div>";
    }

    function init() {
      var app = null;
      if (typeof APPS !== "undefined") {
        app = APPS.find(function (item) { return item.id === getAppId(); });
      }
      if (!app) {
        renderMissing();
        return;
      }
      renderApp(app);
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
